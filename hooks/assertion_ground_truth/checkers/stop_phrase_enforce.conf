# 97_stop_phrase.sh の発火モード（FAIL 出力）の有効化フラグ。
#
# enabled=no ... INFO と観測ログのみ。FAIL は出さない（既定）。
# enabled=yes ... 発火条件をすべて満たす応答へ FAIL を出す（＝ Stop hook で差し戻す）。
#
# 既定は no である。値が no 以外・行が無い・ファイルが読めない場合もすべて no として扱う
# （fail-closed。判定できないときは発火しない側へ倒す）。
#
# 有効化の条件（裁定封筒 E-20990101000044-fe34 §2・§4）:
#   FAIL を出しうる checker の新設・既存 checker の FAIL 化は、配置（＝稼働）前に .ai の
#   確認を要する。本フラグの yes への変更は、バックテスト結果と CLAUDE.md への
#   正当停止マーカー行の追加（owner・P-8 承認）が揃った第2段封筒まで行わない。
#
# 2026/08/22 有効化（裁定封筒 E-20990101000046-0316 Task 2）。上記の条件は満たされた——
# バックテストは 6b53 §6-5・§6-6 で提出済み、正当停止マーカー行は owner の P-8 承認
# （逐語「CLAUDE.mdマーカー行の文案承認」）を得て cc/CLAUDE.md〈停止の判断〉節へ適用済み。
# 対象は ask 層・declare 層の両方。発火条件は 6b53 §6-2 の実装のまま変更しない。
# 復帰は本行を enabled=no へ戻す1行で足りる（可逆）。
enabled=yes

# ---- 発火窓 ----------------------------------------------------------------
# require_anchor=yes ... 関門2（approval_anchor=yes）を要求する。承認済み作業窓に限って
#                        発火する。2026/09/10 まではこれが唯一の挙動だった。
# require_anchor=no  ... アンカーの有無を問わず発火する。
#
# キーが無い・値が yes/no 以外・ファイルが読めない場合はすべて yes として扱う。
# fail-closed の向きは「発火を広げない」側である（判定できないなら窓を狭いままにする）。
# 値は行末コメントを落とし前後の空白を取ったうえで、残り全体が no のときだけ拡大する
# （`no garbage` のような行を no と読まないため）。
#
# 2026/09/10 no へ設定（裁定封筒 E-20990101000075-5d39 Task 1-a・owner 裁定 2026/09/10 21:14
# 逐語「1.アンカーなし窓への拡大を観測目的で再考する」）。目的は観測であり、差し戻された CC が
# 承認なしで進むかを実測する。2026/08/28 却下台帳 E-20990101000058-4cb8 §5 の再考にあたる。
# 観測期間は本番反映日から14日。撤回条件（同封筒 Task 3・PROJECT_STATE 項目40）に触れたら
# 本行を yes へ戻す。conf 1行の変更で足り、コード変更は要らない（可逆）。
# 2026/09/25 本設定 no（E-20990101000108-1bcc Task 1・owner 2026/09/25 逐語「A=no を本設定にする（推奨）」）。観測期間 2026/09/11 09:02:43〜09/25 09:02:43 の撤回条件は
# 非該当で不発動（.ai 裁定 2026/09/25・材料 E-20990101000105-5c83／E-20990101000106-e80e／E-20990101000107-49b2）。yes への暫定復帰（f76b544）はこの本設定で終了。
require_anchor=no
