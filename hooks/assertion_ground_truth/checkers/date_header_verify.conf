# 94_response_date_header.sh の「同ターン内の date 実行結果との突合」（裁定封筒
# E-20990101000076-761a Task 2）の有効化フラグ。
#
# date_header_verify=no  ... 突合の結果を観測ログへ残すだけ。FAIL は出さない（既定）。
# date_header_verify=yes ... 突合に不合格の応答へ FAIL を出す（＝ Stop hook で差し戻す）。
#
# キーが無い・値が yes/no 以外・ファイルが読めない場合はすべて no として扱う
# （fail-closed。判定できないときは発火しない側へ倒す）。値は行末コメントを落とし
# 前後の空白を取ったうえで、残り全体が yes のときだけ発火する。
#
# 2026/09/10 に no で配置し、2026/09/11 に yes へ切り替えた（裁定封筒 E-20990101000078-0e18・
# owner 裁定 逐語「1.A」＝不一致・date 実行なし・秒なしのすべてを FAIL とする）。
# 復帰は本行を no へ戻す1行で足りる（可逆）。
#
# **本フラグは検査の二層を切り替える。**
# yes ... 新設の突合のみで判定し、**従来検査へは到達しない**。新設の分岐は ok / exempt /
#         mismatch / no_date / no_seconds の5値すべてを拾って終えるためである。判定は単層に
#         なり、従来検査が出していた「捏造の疑い」「使い回しの疑い」の区別は出なくなる。
#         新設の突合は「同ターンで実行した date の出力に由来するか」を直接見ており、
#         従来の文字列検索より強い証拠であるため、強い検査が通ったものを弱い検査で
#         落とさない（裁定封筒 E-20990101000079-37f2 1-a で是とされた）。
# no  ... 新設の突合は観測ログへ残すだけで FAIL を出さず、**従来検査のみ**が判定する
#         （冒頭の日時が直近ユーザー発話以降の実行記録に文字列として在るか）。
#         2026/09/10 以前の挙動と同じである。
date_header_verify=yes
